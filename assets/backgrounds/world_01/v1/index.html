<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Забытые мосты · Задники</title>
<style>
:root{--ink:#253e3e;--muted:#657871;--paper:#f3f2e9;--line:#d2dbcd;--green:#32594b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}header,main,footer{max-width:1320px;margin:auto;padding:0 32px}header{padding-top:54px;padding-bottom:30px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--green)}h1{font:clamp(38px,6vw,72px)/1.05 Georgia,serif;margin:16px 0}header p{max-width:750px;color:var(--muted);font-size:18px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 8px}button,.link{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 17px;border-radius:24px;cursor:pointer;text-decoration:none}button:hover,.link:hover{background:#e3e9df}button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}button:focus-visible,a:focus-visible{outline:3px solid #c39135;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 26px}article{min-width:0}.art{display:block;width:100%;border:0;border-radius:12px;padding:0;background:#d6e4df;overflow:hidden}.art img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;transition:opacity .15s}.art:hover img{opacity:.92}.meta{display:flex;gap:14px;margin-top:16px;align-items:start}.number{font:26px Georgia,serif;color:#8b9a7c;padding-top:2px}h2{font:26px/1.15 Georgia,serif;margin:0 0 5px}.desc{font-size:14px;color:var(--muted);margin:0}.badge{font-size:12px;letter-spacing:.025em;margin:8px 0;color:var(--green)}.download{font-size:13px;color:var(--green);text-underline-offset:3px}footer{margin-top:50px;padding-bottom:35px;color:var(--muted);font-size:13px}footer a{color:var(--green)}dialog{padding:0;border:0;background:#172b2c;color:white;border-radius:14px;width:min(1400px,96vw);max-width:96vw;max-height:96vh;overflow:auto}dialog::backdrop{background:#0a151ee8}.dialogbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 18px}.dialogbar button{color:white;border-color:#668078}.dialogbar h2{font:21px Georgia,serif;margin:0}.large{display:block;max-height:75vh;max-width:100%;width:auto;height:auto;margin:auto}.dialogfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;font-size:13px;color:#b7c7be}.dialogfoot a{color:white}dialog small{display:block;color:#b7c7be;margin-top:3px}[hidden]{display:none!important}@media(max-width:650px){header,main,footer{padding-left:18px;padding-right:18px}header{padding-top:30px}.grid{grid-template-columns:1fr;gap:26px}h1{font-size:44px}.dialogbar{flex-wrap:wrap}.dialogbar h2{font-size:18px}}
</style></head><body>
<header><div class="eyebrow">Держись! · Мир 01 · Версия 1</div><h1>Забытые мосты</h1><p>Десять задников одного мира: от открытой солнечной долины до глубоких ущелий и большого разрушенного виадука.</p>
<nav class="nav" aria-label="Фильтр задников"><button data-filter="all" aria-pressed="true">Все 10</button><button data-filter="wide" aria-pressed="false">Горизонтальные</button><button data-filter="vertical" aria-pressed="false">Вертикальные</button></nav></header>
<main><div class="grid" id="grid"></div></main>
<footer>Изображения открываются нажатием. PNG сохранены в исходном размере. <a href="README.md">Использование в игре</a> · <a href="PROMPTS.md">Запросы генерации</a></footer>
<dialog id="viewer"><div class="dialogbar"><div><h2 id="vt"></h2><small id="vs"></small></div><div><button id="prev" aria-label="Предыдущее изображение">←</button> <button id="next" aria-label="Следующее изображение">→</button> <button id="close">Закрыть</button></div></div><img class="large" id="vi" alt=""><div class="dialogfoot"><span id="vd"></span><a id="save" download>Скачать PNG</a></div></dialog>
<script>
const assets=[{"id":1,"title":"Первые шаги","subject":"Открытая солнечная долина","file":"w01_l01_first_steps_bg_v1.png","width":1672,"height":941,"type":"landscape"},{"id":2,"title":"Подставь плечо","subject":"Высокие арки на склоне","file":"w01_l02_lend_a_shoulder_bg_v1.png","width":1672,"height":941,"type":"landscape"},{"id":3,"title":"Не отпускай","subject":"Ущелье с водопадами","file":"w01_l03_dont_let_go_bg_v1.png","width":2172,"height":724,"type":"panorama"},{"id":4,"title":"Ящик","subject":"Руины поселения строителей","file":"w01_l04_the_crate_bg_v1.png","width":2172,"height":724,"type":"panorama"},{"id":5,"title":"Удерживай!","subject":"Старая арочная стена","file":"w01_l05_hold_it_bg_v1.png","width":2172,"height":724,"type":"panorama"},{"id":6,"title":"Живая лестница","subject":"Башня над долиной","file":"w01_l06_living_staircase_bg_v1.png","width":1086,"height":1448,"type":"vertical"},{"id":7,"title":"Качели","subject":"Водяные мельницы и озеро","file":"w01_l07_seesaw_bg_v1.png","width":2172,"height":724,"type":"panorama"},{"id":8,"title":"Подъёмник","subject":"Каменоломня в ущелье","file":"w01_l08_the_lift_bg_v1.png","width":1086,"height":1448,"type":"vertical"},{"id":9,"title":"Цепь","subject":"Узкое глубокое ущелье","file":"w01_l09_the_chain_bg_v1.png","width":1086,"height":1448,"type":"vertical"},{"id":10,"title":"Старый мост","subject":"Панорама разрушенного виадука","file":"w01_l10_old_bridge_bg_v1.png","width":2172,"height":724,"type":"panorama"}];
const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer');let selected=0;
const typeLabel=t=>t==='vertical'?'Вертикальный':t==='panorama'?'Панорама':'Горизонтальный';
assets.forEach((a,i)=>{const card=document.createElement('article');card.dataset.type=a.type;card.innerHTML=`<button class="art" aria-label="Открыть ${a.title}"><img src="${a.file}" alt="${a.subject}" loading="lazy" width="${a.width}" height="${a.height}"></button><div class="meta"><span class="number">${String(a.id).padStart(2,'0')}</span><div><h2>${a.title}</h2><p class="desc">${a.subject}</p><div class="badge">${typeLabel(a.type)} · ${a.width} × ${a.height}</div><a class="download" href="${a.file}" download>Скачать PNG</a></div></div>`;card.querySelector('button').onclick=()=>openImage(i);grid.append(card);});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('article').forEach(c=>c.hidden=!(b.dataset.filter==='all'||(b.dataset.filter==='vertical'?c.dataset.type==='vertical':c.dataset.type!=='vertical')));});
function openImage(i){selected=(i+assets.length)%assets.length;const a=assets[selected];document.querySelector('#vt').textContent=String(a.id).padStart(2,'0')+' · '+a.title;document.querySelector('#vs').textContent=a.subject;document.querySelector('#vi').src=a.file;document.querySelector('#vi').alt=a.subject;document.querySelector('#vd').textContent=typeLabel(a.type)+' · '+a.width+' × '+a.height;document.querySelector('#save').href=a.file;document.querySelector('#save').download=a.file;if(!viewer.open)viewer.showModal();}
document.querySelector('#prev').onclick=()=>openImage(selected-1);document.querySelector('#next').onclick=()=>openImage(selected+1);document.querySelector('#close').onclick=()=>viewer.close();document.addEventListener('keydown',e=>{if(viewer.open&&e.key==='ArrowLeft')openImage(selected-1);if(viewer.open&&e.key==='ArrowRight')openImage(selected+1)});viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
</script></body></html>
