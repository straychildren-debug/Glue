<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Держись! — вступление (мультик кодом)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Мультик целиком кодом: SVG-сцены (scenes/*.js) из общих кукол (lib/cast.js) и основы (lib/core.js).
         Каждый кадр — функция времени; склейку и время ведёт main.js. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1238; }
      #main { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      .t { font-family: Nunito, sans-serif; font-weight: 900; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="74" data-width="1920" data-height="1080">
      <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
      <audio id="score" src="audio/score.wav" data-start="0" data-duration="74" data-track-index="1"></audio>
    </div>
    <script src="lib/core.js"></script>
    <script src="lib/cast.js"></script>
    <script src="lib/places.js"></script>
    <script src="scenes/01_kingdom.js"></script>
    <script src="scenes/02_festival.js"></script>
    <script src="scenes/03_ruins.js"></script>
    <script src="scenes/05_raid.js"></script>
    <script src="scenes/06_morning.js"></script>
    <script src="scenes/07_map.js"></script>
    <script src="scenes/08_road.js"></script>
    <script src="scenes/09_bridge.js"></script>
    <script src="main.js"></script>
    <script>
      window.__timelines["main"] = window.__cartoon.tl;
    </script>
  </body>
</html>
